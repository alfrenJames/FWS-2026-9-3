<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Activity 2: The "Quick Checkout"</title>
</head>
<body>
    <h1>Student Activity 2: Quick Checkout</h1>
    <form>
        <fieldset style="width: 400px;">
            <legend>1. Shipping Address</legend>
            <p>
                <label for="name">Full Name:</label><br>
                <input type="text" id="name" name="name" required>
            </p>
            <p>
                <label for="address">Street Address:</label><br>
                <input type="text" id="address" name="address" required>
            </p>
            <p>
                <label for="zip">Zip Code:</label><br>
                <input type="number" id="zip" name="zip" required>
            </p>
        </fieldset>
        <br>
        <fieldset style="width: 400px;">
            <legend>2. Payment Information</legend>
            <p>
                <label for="card">Card Number:</label><br>
                <input type="text" id="card" name="card" required maxlength="16">
            </p>
            <p>
                <label for="expiry">Expiry Date:</label><br>
                <input type="month" id="expiry" name="expiry" required>
            </p>
        </fieldset>
        <br>
        <p>
            <input type="checkbox" id="newsletter" name="newsletter">
            <label for="newsletter">Sign me up for deals!</label>
        </p>
        <button type="submit">Complete Purchase</button>
    </form>
    <br>
    <br>
    <fieldset style="width: fit-content;">
        <legend>HTML Form Activities</legend>
        <a href="https://htmlpreview.github.io/?https://github.com/alfrenJames/FWS-2026-9-3/blob/main/exercise/Mercado%2C%20John%20Francis%20P/Session2/HtmlForm/index.html">
            <button type="button" style="font-size: 18px; padding: 12px 24px;">⬅️ Back to Activities Menu</button>
        </a>
    </fieldset>
</body>
</html>
