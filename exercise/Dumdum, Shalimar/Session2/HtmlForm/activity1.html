<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form - Feedback Hub Page</title>
</head>

<body>

    <nav>
        <ul>
            <li><a href="index.html">Go back to HTML Form Main Page</a></li>
            <li><a href="activity2.html">Do a quick checkout and complete purchase.</a></li>
        </ul>
    </nav>

    <main>
        <h2>STUDENT ACTIVITY 1: FEEDBACK HUB</h2><br>
    </main>

    <section>
        <h3>Basic Information</h3>
            <form>
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullname" name="fullName" required><br><br>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required><br><br>
            </form> 
    </section>
    
    <section>
        <h3>User Survey</h3>
            <form>
                <label for="surveyTracker">How did you hear about us?</label><br><br>
                <select id="surveyTracker" name="surveyTracker">
                    <option value="word of mouth">Word of mouth (friend, family, coworker, etc.)</option>
                    <option value="search engine">Search engine (Google, other search engines)</option>
                    <option value="social media">Social media (FB, TikTok, etc.)</option>
                    <option value="job portals">Job portals (Jobstreet, Indeed, LinkedIn, etc.)</option>
                    <option value="others">Others...</option>
                </select><br><br>

                <label for="recommend">Would you recommend us?</label><br><br>
                <input type="radio" id="yes" name="yes" value="yes">
                <label for="yes">Yes</label>
                <input type="radio" id="no" name="no" value="no">
                <label for="no">No</label><br><br>

                <label for="comments">Additional Comments:</label><br>
                <textarea id="comments" name="comments" style="width: 300px; height: 100px;" 
                placeholder="Care to comment? Please type here..."></textarea><br><br><br>

                <input type="submit" value="Submit Feedback">
            </form>
    </section>

</body>
</html>
