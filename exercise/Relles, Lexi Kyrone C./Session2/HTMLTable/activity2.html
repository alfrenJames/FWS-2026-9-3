<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Checkout</title>
    <style>body {text-align: center;}</style>
</head>
<body>
    <h1>Quick Checkout</h1>
    <form>
        <h2>Shipping Information</h2>
        <label for="name">Name<span style="color: red;" aria-hidden="true">*</span></label><br>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="address">Address<span style="color: red;" aria-hidden="true">*</span></label><br>
        <input type="text" id="address" name="address" required>
        <br><br>

        <label for="city">City<span style="color: red;" aria-hidden="true">*</span></label><br>
        <input type="text" id="city" name="city" required>
        <br><br>

        <label for="zipcode">Zip Code<span style="color: red;" aria-hidden="true">*</span></label><br>
        <input type="number" id="zipcode" name="zipcode" required>

        <h2>Payment Information</h2>

        <label for="cardnumber">Card Number<span style="color: red;" aria-hidden="true">*</span></label><br>
        <input type="text" id="cardnumber" name="cardnumber" required>
        <br><br>

        <label for="expiry">Expiry Date<span style="color: red;" aria-hidden="true">*</span></label><br>
        <input type="month" id="expiry" name="expiry" required>
        <br><br>

        <label for="cvv">CVV<span style="color: red;" aria-hidden="true">*</span></label><br>
        <input type="number" id="cvv" name="cvv" required>
        <br><br>

        <input type="checkbox" id="newsletter" name="newsletter">
        <label for="newsletter">Sign me up for deals!</label>
        <br><br>

        <input type="submit" value="Place Order">
    </form>
    <br>
    <a href="index.html">Back to Main Page</a>
</body>
</html>
