<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Hub</title>
    <style>body {text-align: center;}</style>
</head>
<body>
    <h1>Feedback Hub</h1>
    <form>
        <label for="fullname">Full Name:<span style="color: red;" aria-hidden="true">*</span></label><br>
        <input type="text" id="fullname" name="fullname" required>
        <br><br>
    
        <label for="email">Email:<span style="color: red;" aria-hidden="true">*</span></label><br>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="source">How did you hear about us?</label><br>
        <select id="source" name="source">
            <option value="" disabled selected hidden>Select an option</option>
            <option value="social-media">Social Media</option>
            <option value="friend-family">Friend or Family</option>
            <option value="search-engine">Search Engine</option>
            <option value="advertisement">Advertisement</option>
            <option value="other">Other</option>
        </select>
        <br><br>

        <p>Would you recommend us?</p>
        <input type="radio" id="recommend-yes" name="recommend" value="yes">
        <label for="recommend-yes">Yes</label>
        <input type="radio" id="recommend-no" name="recommend" value="no">
        <label for="recommend-no">No</label>
        <br><br>

        <label for="comments">Additional Comments:</label><br>
        <textarea id="comments" name="comments" rows="5" cols="40"></textarea>
        <br><br>

        <input type="submit" value="Submit Feedback">
    </form>
    <br>
    <a href="index.html">Back to Main Page</a>
</body>
</html>
