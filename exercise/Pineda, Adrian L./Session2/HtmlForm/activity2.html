<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Checkout Form</title>
</head>
<body>
    <nav>
        <ul>
            <li style="display: inline; margin-right: 20px;">
                • <a href="index.html">Home</a>
            </li>
            <li style="display: inline; margin-right: 20px;">
                • <a href="FeedbackHub.html">Feedback Hub</a>
            </li>
            <li style="display: inline;">
                • <a href="Quickcheckout.html">Quick Checkout</a>
            </li>
        </ul>
    </nav>
    <hr>
    <main>
        <h1>Quick Checkout</h1>
    </main>
    <section>
        <form>
        <ul type="square">
            <li>SHIPPING INFORMATION</li>
        </ul>    
    </section>
    <section>
            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>
            <label for="address">Complete Address:</label><br>
            <input type="text" id="address" name="address" required><br><br>
            <label for="zipcode">Zip code:</label><br>
            <input type="text" id="zipcode" name="zipcode" required><br><br>
    </section>
    <section>
          <ul type="square">
            <li>PAYMENT INFORMATION</li>
          </ul>
    </section>
    <section>
            <label for="cardnumber">Card Number:</label><br>
            <input type="number" id="cardnumber" name="cardnumber" required><br><br>
            <label for="expiry">Expiry Date:</label><br> 
            <input type="text" id="expiry" name="expiry" placeholder="MM/YY"><br><br>
            <input type="checkbox" id="deals" name="deals"> 
            <label for="deals">Sign me up for deals!</label><br><br>  
            <input type="submit" value="Complete Purchase"><br><br>
    </form>
    </section>
    <footer>
        <p>&copy; 2026 HTML Learning. All rights reserved.</p>
    </footer>
</body>
</html>
