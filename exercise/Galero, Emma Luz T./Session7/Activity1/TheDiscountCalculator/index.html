<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Discount Calculator</title>
   <script src="script.js"></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 400px;
      margin: 50px auto;
      padding: 0 15px;
    }
   
    select {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      font-size: 16px;
      border-radius: 4px;
    }
    .checkbox-row {
      margin-top: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .result-box {
      margin-top: 20px;
      padding: 15px;
      background: #fff;
      border-left: 4px solid #0d6efd;
    }
  </style>
</head>
<body>

  <div class="card">
    <h3>Select a Shoe</h3>
    
    <!-- Dropdown List -->
    <label for="shoeSelect">Choose model:</label>
    <select id="shoeSelect" onchange="displayShoeDetails()">
      <option value="" data-price="0">-- Select a shoe --</option>
      <option value="Adidas Ultraboost" data-price="9500">Adidas Ultraboost</option>
      <option value="Adidas AdiZero" data-price="8500.00">Adidas AdiZero</option>
      <option value="Adidas EvoSL" data-price="8500">Adidas EvoSL</option>
      <option value="Adidas Duramo" data-price="4500.00">Adidas Duramo</option>
      <option value="Adidas Superstar" data-price="6000.00">Adidas Superstar</option>
      <option value="Adidas OGSamba" data-price="7000.00">Adidas OG Samba</option>
      <option value="Adidas SL72Pro" data-price="7300.00">Adidas SL72 Pro</option>
    </select>

    <!-- Optional Member Discount Checkbox -->
    <div class="checkbox-row">
      <input type="checkbox" id="memberCheck" onchange="displayShoeDetails()">
      <label for="memberCheck">Apply 10% Store Member Discount</label>
    </div>

    <!-- Output Display Area -->
    <div class="result-box" id="outputBox" style="display: none;">
      <p><strong>Selected Shoe:</strong> <span id="displayName"></span></p>
      <p><strong>Price:</strong> ₱<span id="displayPrice"></span></p>
    </div>
  </div>

  </body>
  </html>
