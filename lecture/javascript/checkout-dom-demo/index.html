
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Checkout System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Mini Store</h1>
        <p>Choose your items and proceed to checkout!</p>
    </header>

    <main class="container">

        <!-- PRODUCT SECTION -->
        <section class="products-section">
            <h2>Available Products</h2>
            <div id="productList" class="product-list">
                <!-- Products generated using JavaScript -->
            </div>
        </section>

        <!-- CUSTOMER INFORMATION -->
        <section class="checkout-section">
            <h2>Customer Information</h2>

            <label for="customerName">Full Name</label>
            <input type="text" id="customerName"
                   placeholder="Enter your name">

            <label for="customerCredit">Available Money (₱)</label>
            <input type="number" id="customerCredit"
                   placeholder="Enter your money" min="0">

            <h2>Order Summary</h2>

            <div id="orderSummary">
                <p>No items selected.</p>
            </div>

            <div class="summary-details">
                <p>Available Money:
                    <strong id="availableMoney">₱0.00</strong>
                </p>

                <p>Total Amount:
                    <strong id="totalAmount">₱0.00</strong>
                </p>

                <p>Remaining Balance:
                    <strong id="balance">₱0.00</strong>
                </p>
            </div>

            <button id="checkoutBtn" disabled>
                Proceed to Checkout
            </button>

            <p id="validationMessage"></p>
        </section>

        <!-- RECEIPT SECTION -->
        <section id="receipt" class="receipt" hidden>
            <h2>Purchase Receipt</h2>
            <div id="receiptDetails"></div>
            <button onclick="window.print()">Print Receipt</button>
        </section>

    </main>

    <footer>
        <p>Simple Checkout System | JavaScript Activity</p>
    </footer>
        <script
        src="https://code.jquery.com/jquery-4.1.0.min.js"
        integrity="sha384-UGSi5euAzE1p4sK41+yKs3vtdPcidmaW6fY2NUITZkjIPyMVUUYB/BV4A5Oa8uu2"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>
    <script src="script.js"></script>
</body>
</html>
