<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning HTML Forms</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/form.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="form.html">Form</a></li>
            <li><a href="table.html">Table</a></li>
            <li><a href="https://www.youtube.com" target="_blank">YouTube</a></li>
        </ul>
    </nav>    
    <main>
        <h1>HTML Forms</h1>
    </main>
    <div>
        <form>
            <div class ="personal-info">
                <h2>Personal Information</h2>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required><br><br>
                <label for="number">Number:</label>
                <input type="number" id="mobileNumber" name="mobileNumber" required><br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br><br>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required><br><br>
            </div>
            <div class="additional-info">
                <h2>Additional Information</h2>
                <div class="gender">
                    <label for="gender">Gender:</label>
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                </div>
                <div class="hobbies">
                    <label for="hobbies">Hobbies:</label>
                    <input type="checkbox" id="reading" name="hobbies" value="reading">
                    <label for="reading">Reading</label>
                    <input type="checkbox" id="traveling" name="hobbies" value="traveling">
                    <label for="traveling">Traveling</label>
                </div>
                <div class="country">
                    <label for="country">Country:</label>
                    <select id="country" name="country">
                        <option value="pilipinas">Philippines</option>
                        <option value="usa">USA</option>
                        <option value="uk">UK</option>
                    </select>
                </div>    
                <div class="message">
                    <label for="message">Message:</label><br>
                    <textarea id="message" name="message" placeholder="Enter your message here..."></textarea><br><br>
                </div>    
            </div>
                
            <input type="submit" value="Submit">
        </form>
    </div>
    <footer>
         <p>&copy; 2023 HTML Learning. All rights reserved.</p>
    </footer>    
</body>
</html>
