<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Responsive Design</title>
</head>
<body>
    <header>
    <h1 class="desktop">Desktop View Greater than or equal to 1024px</h1>
    <h1 class="tablet">Tablet View Between 484px to 1023px</h1>
    <h1 class="mobile">Mobile View Less than 484px</h1>
    </header>
    
    <main class="container">
        
        <section class="row">
            <p class="column">Conten1</p>
            <p class="column">Conten2</p>
            <p class="column">Conten3</p> 
            <p class="column">Conten4</p>  
        </section>

        <section class="row">
            <p class="extra-content">This is a column that takes up 12 columns on small screens and 6 columns on medium screens.</p>
        </section>
        
    </main>
</body>
</html>
